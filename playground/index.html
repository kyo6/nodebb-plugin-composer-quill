<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>quill-nbb playground</title>
  <link rel="stylesheet" href="/node_modules/quill/dist/quill.snow.css" />
  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
    }

    .composer {
      max-width: 960px;
      margin: 0 auto;
    }

    .write-container {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .editor-wrap {
      flex: 1;
    }

    .ql-container {
      min-height: 280px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 16px;
      font-family: monospace;
    }

    .panel {
      margin-top: 16px;
    }

    pre {
      background: #f5f5f5;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="composer" data-uuid="demo-1">
    <div class="write-container">
      <div class="editor-wrap">
        <textarea></textarea>
        <div id="editor"></div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-delta">输出 Delta</button>
    <button id="btn-html">输出 HTML</button>
    <button id="btn-submit-payload">输出提交 payload</button>
    <button id="btn-debug">输出调试信息</button>
  </div>

  <div class="panel">
    <h3>输出</h3>
    <pre id="output"></pre>
  </div>

  <script src="/node_modules/jquery/dist/jquery.min.js"></script>
  <script src="/node_modules/quill/dist/quill.js"></script>
  <script>
    window.$ = window.jQuery = jQuery;
  </script>
  <script src="/playground/loader.js"></script>
  <script src="/playground/mock.js"></script>
  <script src="/static/lib/quill-nbb.js"></script>
  <script src="/playground/main.js"></script>
</body>
</html>
